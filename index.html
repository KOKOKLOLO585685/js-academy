<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أكاديمية جافا سكربت التفاعلية</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; max-width: 800px; margin: 20px auto; padding: 15px; }
    .box { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
    input, textarea { background: #020617; color: #4ade80; border: 1px solid #475569; padding: 8px; border-radius: 5px; direction: ltr; }
    textarea { width: 100%; height: 110px; margin: 10px 0; font-family: monospace; }
    button { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; background: #3b82f6; color: #fff; }
    .green { background: #22c55e; color: #000; } .gold { background: #eab308; color: #000; display: none; }
    pre { background: #020617; padding: 10px; direction: ltr; border-radius: 5px; }
  </style>
</head>
<body>

  <h1 style="text-align:center; color:#eab308;">أكاديمية جافا سكربت التفاعلية</h1>

  <div class="box" style="text-align:center;">
    <div id="login-ui">
      <input type="email" id="email" placeholder="example@gmail.com">
      <button onclick="login()">إرسال رابط الدخول إلى Gmail</button>
    </div>
    <div id="user-ui" style="display:none;">
      <span>الحساب: <b id="u-email" style="color:#4ade80;"></b></span>
      <button style="background:#ef4444;" onclick="logout()">خروج</button>
    </div>
    <p id="msg" style="margin-top:8px;"></p>
  </div>

  <div class="box">
    <b id="prog" style="color:#eab308;">التقدم: 0 / 20</b>
    <h2 id="title"></h2>
    <p id="task" style="color:#fbbf24;"></p>
    <textarea id="code"></textarea>
    <button onclick="run()">تشغيل ▶</button>
    <button class="green" onclick="check()">فحص ✓</button>
    <button class="gold" id="next" onclick="next()">التالي ⬅</button>
    <pre id="out">النتيجة...</pre>
    <b id="fb"></b>
  </div>

  <script>
    const sb = window.supabase.createClient("https://supabase.co", "sb_publishable_gI04KNDWvS7viEOW_2nRvw_dm0ih1li");

    async function login() {
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("msg");
      if (!email) return msg.textContent = "اكتب بريدك أولاً";
      msg.textContent = "جاري الإرسال...";
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: "https://kokoklolo585685.github.io/js-academy/" } });
      msg.style.color = error ? "#f87171" : "#4ade80";
      msg.textContent = error ? error.message : "تم الإرسال! افتح بريدك في Gmail واضغط Sign in";
    }

    async function logout() { await sb.auth.signOut(); location.reload(); }

    async function syncUser() {
      const { data: { user } } = await sb.auth.getUser();
      if (user) {
        document.getElementById("login-ui").style.display = "none";
        document.getElementById("user-ui").style.display = "block";
        document.getElementById("u-email").textContent = user.email;
        if (typeof user.user_metadata?.step === "number") { idx = user.user_metadata.step; load(); }
      }
    }

    const lessons = [
      { t: "1. الطباعة", q: "اطبع Hello World", s: 'console.log("");', c: o => o === "Hello World" },
      { t: "2. المتغيرات", q: "عرّف age = 25 واطبعه", s: 'let age = 25;\nconsole.log(age);', c: o => o === "25" },
      { t: "3. الثوابت", q: "عرّف country = Egypt واطبعه", s: 'const country = "";\nconsole.log(country);', c: o => o === "Egypt" },
      { t: "4. الجمع", q: "اطبع ناتج 15 + 35", s: 'console.log();', c: o => o === "50" },
      { t: "5. الضرب", q: "اطبع ناتج 6 * 7", s: 'console.log();', c: o => o === "42" },
      { t: "6. دمج النصوص", q: "ادمج Java و Script لتطبع JavaScript", s: 'console.log("Java" + "");', c: o => o === "JavaScript" },
      { t: "7. طول النص", q: "اطبع طول كلمة Programming", s: 'console.log("Programming".length);', c: o => o === "11" },
      { t: "8. المقارنة", q: "اطبع نتيجة 10 > 5", s: 'console.log();', c: o => o === "true" },
      { t: "9. المساواة", q: "اطبع نتيجة 10 === 10", s: 'console.log();', c: o => o === "true" },
      { t: "10. الشرط if", q: "إذا score === 100 اطبع Win", s: 'let score = 100;\nif (score === 100) console.log("");', c: o => o === "Win" },
      { t: "11. الشرط else", q: "اطبع Fail لأن mark < 50", s: 'let mark = 30;\nif (mark >= 50) console.log("Pass"); else console.log("");', c: o => o === "Fail" },
      { t: "12. المصفوفات", q: "اطبع أول عنصر colors", s: 'let colors = ["Red", "Blue"];\nconsole.log(colors[]);', c: o => o === "Red" },
      { t: "13. الإضافة push", q: "أضف 4 للمصفوفة واطبع طولها", s: 'let nums =;\nnums.push(4);\nconsole.log(nums.length);', c: o => o === "4" },
      { t: "14. التكرار for", q: "اطبع الأرقام من 1 إلى 3", s: 'for (let i = 1; i <= 3; i++) console.log(i);', c: o => o === "1\n2\n3" },
      { t: "15. التكرار while", q: "اطبع 5 بحلقة while", s: 'let x = 5;\nwhile (x <= 5) { console.log(x); x++; }', c: o => o === "5" },
      { t: "16. الدوال", q: "استدعِ sayHi لطباعة Hi", s: 'function sayHi() { console.log("Hi"); }\n', c: o => o === "Hi" },
      { t: "17. المعاملات", q: "مرر 4 للدالة double لطباعة 8", s: 'function double(n) { console.log(n * 2); }\ndouble();', c: o => o === "8" },
      { t: "18. الإرجاع return", q: "أرجع a + b واطبع 10", s: 'function add(a, b) { return ; }\nconsole.log(add(4, 6));', c: o => o === "10" },
      { t: "19. الكائنات", q: "اطبع user.name", s: 'let user = { name: "Ali" };\nconsole.log();', c: o => o === "Ali" },
      { t: "20. التخرج", q: "اطبع Done 20 Lessons", s: 'console.log("Done 20 Lessons");', c: o => o === "Done 20 Lessons" }
    ];

    let idx = parseInt(localStorage.getItem("js_step")) || 0;
    if (idx >= lessons.length) idx = 0;

    function load() {
      const l = lessons[idx];
      document.getElementById("prog").textContent = "التقدم: " + idx + " / 20";
      document.getElementById("title").textContent = l.t;
      document.getElementById("task").textContent = "المطلوب: " + l.q;
      document.getElementById("code").value = l.s;
      document.getElementById("out").textContent = "النتيجة...";
      document.getElementById("fb").textContent = "";
      document.getElementById("next").style.display = "none";
    }

    function run() {
      let logs = [];
      try {
        new Function("console", document.getElementById("code").value)({ log: (...a) => logs.push(a.join(" ")) });
        const res = logs.join("\n");
        document.getElementById("out").textContent = res || "(تم التنفيذ)";
        return res.trim();
      } catch (e) {
        document.getElementById("out").textContent = "خطأ: " + e.message;
        return null;
      }
    }

    function check() {
      const res = run();
      const fb = document.getElementById("fb");
      if (res !== null && lessons[idx].c(res)) {
        fb.style.color = "#4ade80";
        fb.textContent = idx < 19 ? "✓ صحيح!" : "🎉 مبروك أتممت الـ 20 درساً!";
        if (idx < 19) document.getElementById("next").style.display = "inline-block";
        else { document.getElementById("prog").textContent = "التقدم: 20 / 20"; save(20); }
      } else {
        fb.style.color = "#f87171";
        fb.textContent = "✗ حاول مجدداً";
      }
    }

    async function save(step) {
      localStorage.setItem("js_step", step);
      const { data: { user } } = await sb.auth.getUser();
      if (user) await sb.auth.updateUser({ data: { step } });
    }

    function next() { idx++; save(idx); load(); }
    load();
    syncUser();
  </script>
</body>
</html>

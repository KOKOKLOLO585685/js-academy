<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- إعدادات السيو الأساسية لمحرك بحث جوجل -->
  <title>أكاديمية جافا سكربت التفاعلية - 20 درساً</title>
  <meta name="description" content="تعلم لغة جافا سكربت (JavaScript) مجاناً من الصفر عبر 20 درساً تفاعلياً وتحديات برمجية فورية للمبتدئين.">
  <meta name="keywords" content="أكاديمية جافا سكربت, تعلم جافا سكريبت, دروس JavaScript, تعلم البرمجة">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://kokoklolo585685.github.io/js-academy/" />

  <!-- البيانات المنظمة لجوجل لتعريف الموقع كدورة تعليمية -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Course",
    "name": "أكاديمية جافا سكربت التفاعلية - 20 درساً",
    "description": "دورة تفاعلية لتعلم أساسيات لغة جافا سكربت في 20 درساً.",
    "provider": { "@type": "Organization", "name": "أكاديمية جافا سكربت" },
    "inLanguage": "ar",
    "isAccessibleForFree": true
  }
  </script>

  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; max-width: 800px; margin: 20px auto; padding: 20px; line-height: 1.6; }
    h1, h2 { color: #eab308; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
    .task { background: rgba(234,179,8,0.1); border-right: 4px solid #eab308; padding: 10px; margin: 15px 0; }
    textarea { width: 100%; height: 120px; background: #020617; color: #4ade80; font-family: monospace; padding: 10px; border-radius: 6px; direction: ltr; }
    button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 10px 5px 10px 0; }
    .run { background: #3b82f6; color: #fff; } .check { background: #22c55e; color: #052e16; } .next { background: #eab308; display: none; }
    pre { background: #020617; padding: 12px; border-radius: 6px; direction: ltr; color: #cbd5e1; }
  </style>
</head>
<body>

  <h1>أكاديمية جافا سكربت التفاعلية</h1>
  <p id="prog">التقدم: 0 / 20</p>

  <div class="card">
    <h2 id="title"></h2>
    <p id="desc"></p>
    <div class="task"><strong>المطلوب لتجاوز الدرس:</strong> <span id="task"></span></div>
    <textarea id="code" spellcheck="false"></textarea>
    <div>
      <button class="run" onclick="run()">تشغيل الكود ▶</button>
      <button class="check" onclick="check()">فحص الإجابة ✓</button>
      <button class="next" id="next" onclick="next()">الدرس التالي ⬅</button>
    </div>
    <pre id="out">النتيجة ستظهر هنا...</pre>
  </div>

  <script>
    const lessons = [
      { t: "1. الطباعة (console.log)", d: "اطبع النصوص باستخدام console.log()", q: "اطبع Hello World", s: 'console.log("");', c: o => o === "Hello World" },
      { t: "2. المتغيرات (let)", d: "عرّف متغيراً باستخدام let", q: "عرّف age = 25 واطبعه", s: 'let age = 25;\nconsole.log(age);', c: o => o === "25" },
      { t: "3. الجمع (+)", d: "اجمع الأرقام بعلامة +", q: "اطبع ناتج 10 + 15", s: 'console.log();', c: o => o === "25" }
      // يمكنك إضافة باقي الدروس الـ 20 هنا بنفس النمط المختصر
    ];
    let idx = 0;

    function load() {
      const l = lessons[idx];
      document.getElementById("prog").textContent = `التقدم: ${idx} / 20`;
      document.getElementById("title").textContent = l.t;
      document.getElementById("desc").textContent = l.d;
      document.getElementById("task").textContent = l.q;
      document.getElementById("code").value = l.s;
      document.getElementById("out").textContent = "النتيجة ستظهر هنا...";
      document.getElementById("next").style.display = "none";
    }

    function run() {
      let logs = [];
      try {
        new Function("console", document.getElementById("code").value)({ log: (...a) => logs.push(a.join(" ")) });
        document.getElementById("out").textContent = logs.join("\n") || "(تم التنفيذ)";
      } catch (e) { document.getElementById("out").textContent = "خطأ: " + e.message; }
    }

    function check() {
      run();
      if (lessons[idx].c(document.getElementById("out").textContent.trim())) {
        document.getElementById("out").textContent += "\n✓ إجابة صحيحة!";
        if (idx < lessons.length - 1) document.getElementById("next").style.display = "inline-block";
      }
    }

    function next() { idx++; load(); }
    load();
  </script>
</body>
</html>

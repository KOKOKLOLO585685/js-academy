<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="google-site-verification" content="icYVDRv3vUWP6FVg8HbrCoQK6NTvKI18J1YLyvjX1Ns" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية جافا سكربت - 20 درساً</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Tahoma, sans-serif; background: #1e1e2f; color: #fff; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #141421; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00b894; }
        header h2 { margin: 0; font-size: 20px; }
        #progressText { background: #2a2a40; padding: 6px 14px; border-radius: 20px; font-weight: bold; color: #00ffcc; }
        .container { display: flex; flex: 1; flex-wrap: wrap; max-width: 1100px; margin: 20px auto; width: 95%; gap: 20px; }
        .sidebar { flex: 1; min-width: 240px; background: #2a2a40; padding: 15px; border-radius: 12px; max-height: 78vh; overflow-y: auto; }
        .lesson-btn { display: block; width: 100%; text-align: right; background: #1e1e2f; color: #fff; border: 1px solid #444; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .lesson-btn:hover { border-color: #00b894; }
        .lesson-btn.active { background: #00b894; border-color: #00b894; font-weight: bold; }
        .main-content { flex: 3; min-width: 300px; background: #2a2a40; padding: 25px; border-radius: 12px; height: fit-content; }
        .task-box { background: #1e1e2f; border-right: 4px solid #fdcb6e; padding: 15px; margin: 15px 0; border-radius: 6px; }
        textarea { width: 100%; height: 160px; direction: ltr; font-family: monospace; font-size: 16px; background: #141421; color: #00ffcc; border: 1px solid #444; border-radius: 8px; padding: 12px; box-sizing: border-box; resize: vertical; }
        .actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button.action-btn { border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; color: white; }
        .btn-run { background: #0984e3; }
        .btn-check { background: #00b894; }
        .btn-next { background: #6c5ce7; display: none; }
        #output { background: #000; color: #0f0; padding: 15px; margin-top: 15px; border-radius: 8px; direction: ltr; min-height: 50px; font-family: monospace; font-size: 15px; }
        #feedback { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <header>
        <h2>أكاديمية جافا سكربت التفاعلية</h2>
        <span id="progressText">التقدم: 0 / 20</span>
    </header>

    <div class="container">
        <div class="sidebar" id="lessonsList"></div>
        <div class="main-content">
            <h2 id="lessonTitle">عنوان الدرس</h2>
            <p id="lessonDesc">شرح الدرس...</p>
            <div class="task-box">
                <strong>المطلوب لتجاوز الدرس:</strong>
                <p id="lessonTask">وصف التحدي...</p>
            </div>
            <textarea id="codeEditor" spellcheck="false"></textarea>
            <div class="actions">
                <button class="action-btn btn-run" onclick="runCode()">تشغيل الكود ▶</button>
                <button class="action-btn btn-check" onclick="checkSolution()">فحص الإجابة ✓</button>
                <button class="action-btn btn-next" id="nextBtn" onclick="nextLesson()">الدرس التالي ⬅</button>
            </div>
            <div id="output">النتيجة ستظهر هنا...</div>
            <div id="feedback"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
